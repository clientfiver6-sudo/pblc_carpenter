name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Build Compilation
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_URL: https://dummy-url.supabase.co
          SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          ANTHROPIC_API_KEY: sk-ant-dummykeydummykeydummykeydummykeydummykeydummykey
          ENCRYPTION_KEY: d3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ffd3ff
          CRON_SECRET: dummy-cron-secret
